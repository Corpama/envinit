name: Release env_tool

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Assemble and publish env_tool
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble lightweight release metadata and tools
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          # Keep v0.4.1 available while replacing the withdrawn v0.4.2.
          COS_RELEASE_KEEP: ${{ github.ref_name == 'v0.4.3' && '0' || '2' }}
        run: bash scripts/github-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "error: missing Chinese release notes: $notes_file" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
             --notes-file "$notes_file"

      - name: Withdraw v0.4.2 after verifying its replacement
        if: github.ref_name == 'v0.4.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.3 --json isDraft,assets | jq -e '.isDraft == false and (.assets | length == 8)'
          gh release delete v0.4.2 --yes
