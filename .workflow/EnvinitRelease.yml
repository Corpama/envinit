version: '1.0'
name: envinit-release
displayName: envinit 完整包发布
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
stages:
  - name: assemble-release
    displayName: 组装并发布 env_tool
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@golang
        name: build_release
        displayName: 下载 COS 物料并组装发布包
        golangVersion: '1.16'
        commands:
          - bash scripts/gitee-go-release.sh
        artifacts:
          - name: ENVINIT_RELEASE
            path:
              - ./release
        strategy: {}
      - step: publish@general_artifacts
        name: upload_release_artifact
        displayName: 上传发布制品
        dependArtifact: ENVINIT_RELEASE
        artifactRepository: default
        artifactName: envinit-release
        strategy: {}
      - step: publish@release_artifacts
        name: publish_release_artifact
        displayName: 发布 envinit 版本
        dependArtifact: envinit-release
        artifactRepository: release
        version: ${GITEE_PIPELINE_BUILD_NUMBER}
        autoIncrement: false
        strategy: {}
