version: '1.0'
name: envinit-release
displayName: envinit_build_and_release
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
stages:
  - stage:
    name: assemble-release
    displayName: assemble release
    strategy: naturally
    trigger: auto
    steps:
      - step: build@golang
        name: build_release
        displayName: Download data from COS
        golangVersion: '1.16'
        commands: |
          bash scripts/gitee-go-release.sh
        artifacts:
          - name: ENVINIT_RELEASE
            path:
              - ./release
        strategy: {}
      - step: publish@general_artifacts
        name: upload_release_artifact
        displayName: Upload release
        dependsOn: build_release
        dependArtifact: ENVINIT_RELEASE
        artifactRepository: default
        artifactName: envinit-release
        strategy: {}
      - step: publish@release_artifacts
        name: publish_release_artifact
        displayName: release envinit
        dependsOn: upload_release_artifact
        dependArtifact: envinit-release
        artifactRepository: release
        version: '0.1.0.0'
        autoIncrement: true
        strategy: {}
